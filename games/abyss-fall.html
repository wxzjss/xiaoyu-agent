<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#05070d">
<title>鲸落·深渊 — ABYSS FALL</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:100%; height:100%; overflow:hidden; background:#05070d;
    -webkit-tap-highlight-color:transparent; user-select:none;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  }
  #wrap { position:fixed; inset:0; background:#05070d; }
  #game {
    position:absolute; image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    background:#05070d;
  }
  #ui { position:absolute; left:0; top:0; pointer-events:none; }
  #boot {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; color:#8fd4f0; background:#05070d; z-index:10;
    font-size:14px; letter-spacing:2px;
  }
  #boot .t { font-size:30px; font-weight:700; color:#dff4ff; letter-spacing:8px;
    text-shadow:0 0 24px rgba(110,200,255,.75); }
  #boot .s { font-size:11px; color:#4a6a8a; letter-spacing:3px; }
  #boot .spin { width:26px; height:26px; border:2px solid #1e2c4a; border-top-color:#8fd4f0;
    border-radius:50%; animation:sp .9s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  #err { position:absolute; left:12px; bottom:12px; right:12px; color:#ff8f9e;
    font:12px/1.5 monospace; white-space:pre-wrap; display:none; z-index:20;
    background:rgba(0,0,0,.8); padding:10px; border-radius:8px; max-height:40%; overflow:auto; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <canvas id="ui"></canvas>
  <div id="boot">
    <div class="t">鲸 落 · 深 渊</div>
    <div class="spin"></div>
    <div class="s">A B Y S S   F A L L</div>
  </div>
  <div id="err"></div>
</div>
<script>
window.addEventListener('error', function(e){
  var el = document.getElementById('err');
  if(!el) return;
  el.style.display = 'block';
  el.textContent += (e.message || e.error) + '\n  at ' + (e.filename||'') + ':' + (e.lineno||'') + '\n';
});
</script>
<script>
/* ===== 00-core.js ===== */
;(function(){
/* ============================================================
 * 鲸落·深渊 —— 核心层（画笔 / 烘焙 / 输入 / 相机 / 工具）
 * 本文件只提供底层设施，不含任何玩法逻辑。
 * ============================================================ */
(function () {
  'use strict';
  const G = (window.G = window.G || {});
  G.ART = G.ART || {};
  G.WEAPONS = G.WEAPONS || [];
  G.ENEMIES = G.ENEMIES || [];
  G.PASSIVES = G.PASSIVES || [];

  /* ========== 颜色工具 ========== */
  function hex2rgb(h) {
    if (typeof h !== 'string') return [255, 255, 255];
    h = h.trim();
    if (h[0] === '#') {
      if (h.length === 4) return [parseInt(h[1] + h[1], 16), parseInt(h[2] + h[2], 16), parseInt(h[3] + h[3], 16)];
      return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)];
    }
    const m = h.match(/rgba?\(([^)]+)\)/);
    if (m) {
      const p = m[1].split(',').map(Number);
      return [p[0] | 0, p[1] | 0, p[2] | 0];
    }
    return [255, 255, 255];
  }
  function withAlpha(c, a) {
    const [r, g, b] = hex2rgb(c);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  function shade(c, k) {
    const [r, g, b] = hex2rgb(c);
    const f = (v) => Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k)));
    return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
  }
  G.hex2rgb = hex2rgb;
  G.withAlpha = withAlpha;
  G.shade = shade;

  /* ========== 画笔 Px ========== */
  class Px {
    constructor(w, h) {
      this.w = Math.max(1, w | 0);
      this.h = Math.max(1, h | 0);
      this.cv = document.createElement('canvas');
      this.cv.width = this.w;
      this.cv.height = this.h;
      this.ctx = this.cv.getContext('2d');
      this.ctx.imageSmoothingEnabled = false;
      this._c = null;
    }
    _fill(c) {
      if (c !== undefined && c !== null) {
        if (c !== this._c) {
          this.ctx.fillStyle = c;
          this._c = c;
        }
        return true;
      }
      return this._c !== null;
    }
    px(x, y, c) {
      if (!this._fill(c)) return this;
      this.ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
      return this;
    }
    rect(x, y, w, h, c) {
      if (!this._fill(c)) return this;
      this.ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
      return this;
    }
    line(x0, y0, x1, y1, c) {
      if (!this._fill(c)) return this;
      x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
      let dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
      let sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let err = dx + dy;
      for (let i = 0; i < 4000; i++) {
        this.ctx.fillRect(x0, y0, 1, 1);
        if (x0 === x1 && y0 === y1) break;
        const e2 = 2 * err;
        if (e2 >= dy) { err += dy; x0 += sx; }
        if (e2 <= dx) { err += dx; y0 += sy; }
      }
      return this;
    }
    circle(cx, cy, r, c) {
      if (!this._fill(c)) return this;
      cx = Math.round(cx); cy = Math.round(cy); r = Math.max(0, Math.round(r));
      for (let dy = -r; dy <= r; dy++) {
        const k = r * r - dy * dy;
        if (k < 0) continue;
        const dx = Math.floor(Math.sqrt(k));
        this.ctx.fillRect(cx - dx, cy + dy, dx * 2 + 1, 1);
      }
      return this;
    }
    disc(cx, cy, r, c) { return this.circle(cx, cy, r, c); }
    ring(cx, cy, r, c) {
      if (!this._fill(c)) return this;
      cx = Math.round(cx); cy = Math.round(cy); r = Math.max(1, Math.round(r));
      let x = r, y = 0, err = 1 - r;
      while (x >= y) {
        this.ctx.fillRect(cx + x, cy + y, 1, 1);
        this.ctx.fillRect(cx + y, cy + x, 1, 1);
        this.ctx.fillRect(cx - y, cy + x, 1, 1);
        this.ctx.fillRect(cx - x, cy + y, 1, 1);
        this.ctx.fillRect(cx - x, cy - y, 1, 1);
        this.ctx.fillRect(cx - y, cy - x, 1, 1);
        this.ctx.fillRect(cx + y, cy - x, 1, 1);
        this.ctx.fillRect(cx + x, cy - y, 1, 1);
        y++;
        if (err < 0) err += 2 * y + 1;
        else { x--; err += 2 * (y - x) + 1; }
      }
      return this;
    }
    ellipse(cx, cy, rx, ry, c) {
      if (!this._fill(c)) return this;
      cx = Math.round(cx); cy = Math.round(cy);
      rx = Math.max(0, rx); ry = Math.max(1, ry);
      for (let dy = -Math.ceil(ry); dy <= Math.ceil(ry); dy++) {
        const k = 1 - (dy * dy) / (ry * ry);
        if (k < 0) continue;
        const dx = Math.floor(rx * Math.sqrt(k));
        this.ctx.fillRect(cx - dx, cy + dy, dx * 2 + 1, 1);
      }
      return this;
    }
    tri(x0, y0, x1, y1, x2, y2, c) {
      return this.poly([[x0, y0], [x1, y1], [x2, y2]], c);
    }
    poly(pts, c) {
      if (!this._fill(c) || !pts || pts.length < 3) return this;
      let minY = Infinity, maxY = -Infinity;
      for (const p of pts) { if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1]; }
      minY = Math.floor(minY); maxY = Math.ceil(maxY);
      const xs = [];
      for (let y = minY; y <= maxY; y++) {
        xs.length = 0;
        for (let i = 0; i < pts.length; i++) {
          const a = pts[i], b = pts[(i + 1) % pts.length];
          if ((a[1] <= y && b[1] > y) || (b[1] <= y && a[1] > y)) {
            xs.push(a[0] + ((y - a[1]) / (b[1] - a[1])) * (b[0] - a[0]));
          }
        }
        xs.sort((p, q) => p - q);
        for (let i = 0; i + 1 < xs.length; i += 2) {
          const x0 = Math.round(xs[i]), x1 = Math.round(xs[i + 1]);
          if (x1 >= x0) this.ctx.fillRect(x0, y, x1 - x0 + 1, 1);
        }
      }
      return this;
    }
    glow(cx, cy, r, c) {
      const g = this.ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(1, r));
      g.addColorStop(0, withAlpha(c, 0.9));
      g.addColorStop(0.45, withAlpha(c, 0.45));
      g.addColorStop(1, withAlpha(c, 0));
      const old = this.ctx.fillStyle;
      this.ctx.fillStyle = g;
      this.ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
      this.ctx.fillStyle = old;
      this._c = null;
      return this;
    }
    outline(c) {
      const W = this.w, H = this.h;
      const ctx = this.ctx;
      const img = ctx.getImageData(0, 0, W, H);
      const d = img.data;
      const solid = new Uint8Array(W * H);
      for (let i = 0; i < W * H; i++) solid[i] = d[i * 4 + 3] > 8 ? 1 : 0;
      const rgb = hex2rgb(c);
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = y * W + x;
          if (solid[i]) continue;
          let near = 0;
          if (x > 0 && solid[i - 1]) near = 1;
          else if (x < W - 1 && solid[i + 1]) near = 1;
          else if (y > 0 && solid[i - W]) near = 1;
          else if (y < H - 1 && solid[i + W]) near = 1;
          if (near) {
            d[i * 4] = rgb[0];
            d[i * 4 + 1] = rgb[1];
            d[i * 4 + 2] = rgb[2];
            d[i * 4 + 3] = 255;
          }
        }
      }
      ctx.putImageData(img, 0, 0);
      this._c = null;
      return this;
    }
    noise(x, y, w, h, colors, seed, density) {
      let s = (seed || 1) * 9301 + 49297;
      const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
      density = density == null ? 0.35 : density;
      for (let j = 0; j < h; j++) {
        for (let i = 0; i < w; i++) {
          if (rnd() < density) this.px(x + i, y + j, colors[(rnd() * colors.length) | 0]);
        }
      }
      return this;
    }
    get(x, y) {
      const d = this.ctx.getImageData(x, y, 1, 1).data;
      return d[3] < 8 ? null : 'rgb(' + d[0] + ',' + d[1] + ',' + d[2] + ')';
    }
  }
  G.Px = Px;

  /* ========== 预烘焙 ========== */
  G.BAKED = {};
  G.bakeArt = function () {
    G.BAKED = {};
    let n = 0;
    for (const id in G.ART) {
      const def = G.ART[id];
      if (!def || !def.draw) continue;
      const fr = Math.max(1, def.frames | 0 || 1);
      const list = [];
      for (let f = 0; f < fr; f++) {
        const p = new Px(def.w | 0 || 8, def.h | 0 || 8);
        try { def.draw(p, f); } catch (e) { console.warn('[art] ' + id + ' 第 ' + f + ' 帧画挂了', e); }
        list.push(p.cv);
      }
      G.BAKED[id] = {
        w: def.w | 0 || 8, h: def.h | 0 || 8,
        frames: list,
        ax: def.ax !== undefined ? def.ax : (def.w | 0 || 8) / 2,
        ay: def.ay !== undefined ? def.ay : (def.h | 0 || 8) / 2,
      };
      n++;
    }
    console.log('[art] 烘焙完成 ' + n + ' 个精灵');
    return n;
  };

  /* 画精灵。opt: {f, flip, ax, ay, scale, alpha, rot, tint} */
  G.drawArt = function (ctx, id, x, y, opt) {
    const a = G.BAKED[id];
    if (!a || !a.frames.length) return false;
    const o = opt || {};
    const f = o.f == null ? 0 : (Math.abs(o.f | 0) % a.frames.length);
    const cv = a.frames[f];
    const ax = o.ax != null ? o.ax : a.ax;
    const ay = o.ay != null ? o.ay : a.ay;
    const px = Math.round(x), py = Math.round(y);
    if (!o.flip && !o.scale && !o.rot && o.alpha == null) {
      ctx.drawImage(cv, px - Math.round(ax), py - Math.round(ay));
      return true;
    }
    ctx.save();
    ctx.translate(px, py);
    if (o.rot) ctx.rotate(o.rot);
    if (o.scale) ctx.scale(o.flip ? -o.scale : o.scale, o.scale);
    else if (o.flip) ctx.scale(-1, 1);
    if (o.alpha != null) ctx.globalAlpha = o.alpha;
    ctx.drawImage(cv, -Math.round(ax), -Math.round(ay));
    ctx.restore();
    return true;
  };

  /* ========== 画布 ============ */
  G.W = 640;
  G.H = 360;

  G.initCanvas = function () {
    G.cv = document.getElementById('game');
    G.uctxEl = document.getElementById('ui');
    G.ctx = G.cv.getContext('2d', { alpha: false });
    G.ctx.imageSmoothingEnabled = false;
    G.uctx = G.uctxEl.getContext('2d');
    G.cv.width = G.W;
    G.cv.height = G.H;
    G.resize();
    window.addEventListener('resize', G.resize);
  };

  G.viewScale = 1;
  G.viewOffX = 0;
  G.viewOffY = 0;

  G.resize = function () {
    const dw = window.innerWidth, dh = window.innerHeight;
    let s = Math.min(dw / G.W, dh / G.H);
    // 尽量取整，画质更锐利
    if (s >= 1) s = Math.floor(s * 2) / 2;
    if (s <= 0) s = 0.5;
    const cw = Math.round(G.W * s), ch = Math.round(G.H * s);
    G.viewScale = s;
    G.viewOffX = Math.round((dw - cw) / 2);
    G.viewOffY = Math.round((dh - ch) / 2);
    G.cv.style.width = cw + 'px';
    G.cv.style.height = ch + 'px';
    G.cv.style.left = G.viewOffX + 'px';
    G.cv.style.top = G.viewOffY + 'px';

    const dpr = Math.min(2, window.devicePixelRatio || 1);
    G.uctxEl.width = Math.round(dw * dpr);
    G.uctxEl.height = Math.round(dh * dpr);
    G.uctxEl.style.width = dw + 'px';
    G.uctxEl.style.height = dh + 'px';
    G.uctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    G.uctx.imageSmoothingEnabled = true;
    G.uiW = dw;
    G.uiH = dh;
    if (G.onResize) G.onResize(dw, dh);
  };

  /* 屏幕坐标 -> 逻辑坐标 */
  G.toLogic = function (sx, sy) {
    return { x: (sx - G.viewOffX) / G.viewScale, y: (sy - G.viewOffY) / G.viewScale };
  };

  /* ========== 输入 ========== */
  const keys = Object.create(null);      // 按住
  const pressed = Object.create(null);   // 本帧刚按下
  const released = Object.create(null);
  G.keys = keys;
  G.pressed = pressed;
  G.released = released;
  G.mouse = { x: G.W / 2, y: G.H / 2, down: false, clicked: false, wx: 0, wy: 0 };
  G.anyKeyThisFrame = false;

  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right',
    Space: 'ok', Enter: 'ok', KeyJ: 'ok',
    Escape: 'esc', KeyP: 'esc',
    ShiftLeft: 'dash', ShiftRight: 'dash', KeyK: 'dash', KeyL: 'dash',
    Digit1: '1', Digit2: '2', Digit3: '3', Digit4: '4', Digit5: '5',
    KeyR: 'r', KeyM: 'm', KeyQ: 'q', KeyE: 'e', KeyF: 'f', Tab: 'tab',
  };

  G.setupInput = function () {
    window.addEventListener('keydown', (ev) => {
      const k = KEYMAP[ev.code] || ev.key.toLowerCase();
      if (!keys[k]) pressed[k] = true;
      keys[k] = true;
      G.anyKeyThisFrame = true;
      if (['up', 'down', 'left', 'right', 'ok', 'esc', 'tab'].includes(k)) ev.preventDefault();
    });
    window.addEventListener('keyup', (ev) => {
      const k = KEYMAP[ev.code] || ev.key.toLowerCase();
      keys[k] = false;
      released[k] = true;
    });
    window.addEventListener('blur', () => {
      for (const k in keys) keys[k] = false;
    });

    const moveMouse = (ev) => {
      const lg = G.toLogic(ev.clientX, ev.clientY);
      G.mouse.x = lg.x; G.mouse.y = lg.y;
      G.mouse.sx = ev.clientX; G.mouse.sy = ev.clientY;
      G.anyKeyThisFrame = true;
    };
    window.addEventListener('mousemove', moveMouse);
    window.addEventListener('mousedown', (ev) => {
      if (ev.button === 0) { G.mouse.down = true; G.mouse.clicked = true; }
      moveMouse(ev);
    });
    window.addEventListener('mouseup', (ev) => { if (ev.button === 0) G.mouse.down = false; });
    window.addEventListener('contextmenu', (ev) => ev.preventDefault());

    // 触屏：虚拟摇杆
    G.touch = { active: false, jx: 0, jy: 0, ox: 0, oy: 0, id: null };
    const startTouch = (ev) => {
      G.anyKeyThisFrame = true;
      for (const t of ev.changedTouches) {
        if (G.touch.id === null) {
          G.touch.id = t.identifier;
          G.touch.ox = t.clientX; G.touch.oy = t.clientY;
          G.touch.active = true;
          G.touch.jx = 0; G.touch.jy = 0;
        }
      }
    };
    const moveTouch = (ev) => {
      for (const t of ev.changedTouches) {
        if (t.identifier === G.touch.id) {
          let dx = t.clientX - G.touch.ox, dy = t.clientY - G.touch.oy;
          const d = Math.hypot(dx, dy), max = 60;
          if (d > max) { dx = dx / d * max; dy = dy / d * max; G.touch.ox = t.clientX - dx; G.touch.oy = t.clientY - dy; }
          G.touch.jx = dx / max; G.touch.jy = dy / max;
        }
      }
    };
    const endTouch = (ev) => {
      for (const t of ev.changedTouches) {
        if (t.identifier === G.touch.id) {
          G.touch.id = null; G.touch.active = false; G.touch.jx = 0; G.touch.jy = 0;
        }
      }
    };
    window.addEventListener('touchstart', startTouch, { passive: true });
    window.addEventListener('touchmove', moveTouch, { passive: true });
    window.addEventListener('touchend', endTouch, { passive: true });
    window.addEventListener('touchcancel', endTouch, { passive: true });

    // 手柄
    G.pad = { x: 0, y: 0, ok: false, dash: false, esc: false };
  };

  G.pollGamepad = function () {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let px = 0, py = 0, ok = false, dash = false, esc = false;
    for (const gp of pads) {
      if (!gp || !gp.connected) continue;
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      if (Math.abs(ax) > 0.2) px = ax;
      if (Math.abs(ay) > 0.2) py = ay;
      if (gp.buttons[0] && gp.buttons[0].pressed) ok = true;
      if (gp.buttons[1] && gp.buttons[1].pressed) dash = true;
      if (gp.buttons[9] && gp.buttons[9].pressed) esc = true;
    }
    const p = G.pad;
    if ((p.x === 0 && px !== 0) || (p.y === 0 && py !== 0) || (p.ok === false && ok)) {
      if (px || py || ok) G.anyKeyThisFrame = true;
    }
    p.x = px; p.y = py; p.ok = ok; p.dash = dash; p.esc = esc;
  };

  /* 取移动向量（已归一化） */
  G.moveVec = function () {
    let x = 0, y = 0;
    if (keys.left) x -= 1;
    if (keys.right) x += 1;
    if (keys.up) y -= 1;
    if (keys.down) y += 1;
    if (G.touch.active) { x += G.touch.jx; y += G.touch.jy; }
    if (G.pad.x || G.pad.y) { x += G.pad.x; y += G.pad.y; }
    const d = Math.hypot(x, y);
    if (d > 1) { x /= d; y /= d; }
    return { x, y, len: Math.min(1, d) };
  };

  G.endFrameInput = function () {
    for (const k in pressed) delete pressed[k];
    for (const k in released) delete released[k];
    G.mouse.clicked = false;
    G.anyKeyThisFrame = false;
  };

  /* ========== 相机 ========== */
  G.camera = {
    x: G.W / 2,
    y: G.H / 2,
    shake: 0,
    shakeT: 0,
    sx: 0,
    sy: 0,
    follow(tx, ty, dt, lerp) {
      const k = 1 - Math.pow(1 - (lerp == null ? 0.18 : lerp), dt * 60);
      this.x += (tx - this.x) * k;
      this.y += (ty - this.y) * k;
    },
    kick(amp, time) {
      this.shake = Math.max(this.shake, amp);
      this.shakeT = Math.max(this.shakeT, time == null ? 0.18 : time);
    },
    update(dt) {
      if (this.shakeT > 0) {
        this.shakeT -= dt;
        const k = Math.max(0, this.shakeT);
        const a = this.shake * Math.min(1, k * 5);
        this.sx = (Math.random() * 2 - 1) * a;
        this.sy = (Math.random() * 2 - 1) * a;
        if (this.shakeT <= 0) { this.shake = 0; this.sx = 0; this.sy = 0; }
      } else { this.sx = 0; this.sy = 0; }
    },
    apply(ctx) {
      ctx.translate(
        Math.round(-this.x + G.W / 2 + this.sx),

    const a = ACHS.find((x) => x.id === id);
    if (!a) return;
    Game.save.achs[id] = 1;
    persist();
    toast('成就达成：' + a.name);
    if (G.AUDIO) G.AUDIO.sfx('levelup');
  }
  Game.unlockAch = unlockAch;

  function toast(str, t) {
    Game.msg = str;
    Game.msgT = t || 2.2;
  }
  Game.toast = toast;

  /* ---------- 空间网格 ---------- */
  const GS = 64;
  let grid = new Map();
  function gridKey(gx, gy) { return gx * 73856093 ^ gy * 19349663; }
  function buildGrid() {
    grid.clear();
    const es = Game.enemies;
    for (let i = 0; i < es.length; i++) {
      const e = es[i];
      const k = gridKey(Math.floor(e.x / GS), Math.floor(e.y / GS));
      let a = grid.get(k);
      if (!a) { a = []; grid.set(k, a); }
      a.push(e);
    }
  }
  function nearEnemies(x, y, r, cb) {
    const x0 = Math.floor((x - r) / GS), x1 = Math.floor((x + r) / GS);
    const y0 = Math.floor((y - r) / GS), y1 = Math.floor((y + r) / GS);
    for (let gy = y0; gy <= y1; gy++) {
      for (let gx = x0; gx <= x1; gx++) {
        const a = grid.get(gridKey(gx, gy));
        if (!a) continue;
        for (let i = 0; i < a.length; i++) if (cb(a[i]) === false) return;
      }
    }
  }
  Game.nearEnemies = nearEnemies;

  /* ---------- 粒子 / 特效 ---------- */
  function particle(x, y, o) {
    if (Game.particles.length > 900) return;
    o = o || {};
    Game.particles.push({
      x, y,
      vx: o.vx || 0, vy: o.vy || 0,
      life: o.life || 0.5, max: o.life || 0.5,
      color: o.color || '#fff',
      r: o.r == null ? 1 : o.r,
      grav: o.gravity || 0,
      drag: o.drag == null ? 0.92 : o.drag,
      glow: o.glow || false,
      shrink: o.shrink !== false,
    });
  }
  function burst(x, y, n, o) {
    o = o || {};
    for (let i = 0; i < n; i++) {
      const a = o.angle == null ? Math.random() * Math.PI * 2 : o.angle + (Math.random() - 0.5) * (o.spread || 0.9);
      const sp = (o.speed || 60) * (0.4 + Math.random() * 0.9);
      particle(x, y, {
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: (o.life || 0.5) * (0.6 + Math.random() * 0.8),
        color: Array.isArray(o.color) ? G.pick(o.color) : (o.color || '#fff'),
        r: o.r || (Math.random() < 0.3 ? 2 : 1),
        gravity: o.gravity, drag: o.drag, glow: o.glow,
      });
    }
  }
  Game.particle = particle;
  Game.burst = burst;

  function ringFx(x, y, r, color, life, w) {
    Game.effects.push({ kind: 'ring', x, y, r0: r * 0.25, r1: r, color, life: life || 0.35, max: life || 0.35, w: w || 2 });
  }
  function slashFx(x, y, ang, len, width, color, life) {
    Game.effects.push({ kind: 'slash', x, y, ang, len, width: width || 10, color, life: life || 0.2, max: life || 0.2 });
  }
  function floatText(x, y, str, color, size) {
    if (Game.texts.length > 60) Game.texts.shift();
    Game.texts.push({ x, y, str, color: color || '#fff', life: 0.7, max: 0.7, vy: -26, size: size || 9 });
  }
  Game.ringFx = ringFx;
  Game.slashFx = slashFx;
  Game.floatText = floatText;

  /* ---------- 玩家 ---------- */
  function makePlayer(ch) {
    const meta = Game.save.meta || {};
    const p = {
      x: 320, y: 180, vx: 0, vy: 0,
      r: 6,
      hp: 1, maxHp: 1,
      speed: 96,
      facing: 1,
      hurtT: 0, invuln: 0,
      level: 1, xp: 0, xpNext: 6,
      weapons: [], passives: [],
      buffs: {},
      dmgFlash: 0,
      animT: 0,
      char: ch,
      regenT: 0,
      dashCd: 0, dashT: 0,
      killCount: 0,
      shield: 0,
      mulBase: null,
      stats: null,
    };
    p.maxHp = ch.hp + (meta.m_hp || 0) * 8;
    p.hp = p.maxHp;
    p.speed = ch.speed * (1 + (meta.m_spd || 0) * 0.03);
    return p;
  }

  function recomputeStats() {
    const p = Game.player;
    const m = {
      dmg: 1 + Game.player.char.dmg + (Game.save.meta.m_dmg || 0) * 0.04,
      area: 1, moveSpeed: 1, cd: 1, amount: 0, duration: 1,
      magnet: 1, armor: 0, regen: 0, luck: Game.player.char.luck + (Game.save.meta.m_lck || 0) * 0.05,
      critDmg: 1.6, xpGain: 1 + (Game.save.meta.m_xp || 0) * 0.06,
      crit: 0.05, projSpeed: 1, dash: 0, thorns: 0,
    };
    // 被动累加
    for (const ps of p.passives) {
      const def = G.PASSIVES.find((x) => x.id === ps.id);
      if (!def) continue;
      for (let i = 0; i < ps.lv; i++) {
        try { def.apply({ mul: m, player: p }, i + 1); } catch (e) { }
      }
    }
    // 角色 / 局外
    m.dmg = Math.max(0.15, m.dmg + 0);
    m.moveSpeed = Math.max(0.3, m.moveSpeed);
    m.cd = Math.max(0.25, m.cd);
    m.armor = Math.min(0.75, m.armor);
    p.stats = m;
    p.speed = p.char.speed * m.moveSpeed;
    return m;
  }
  Game.recomputeStats = recomputeStats;

  /* ---------- 武器 ---------- */
  function addWeapon(id) {
    const p = Game.player;
    const def = G.WEAPONS.find((w) => w.id === id);
    if (!def) return null;
    const ex = p.weapons.find((w) => w.id === id);
    if (ex) {
      if (ex.lv < (def.maxLv || 8)) { ex.lv++; return ex; }
      return null;
    }
    if (p.weapons.length >= MAX_WEAPONS) return null;
    const w = { id, lv: 1, timer: 0.1 + Math.random() * 0.2, def };
    p.weapons.push(w);
    return w;
  }
  Game.addWeapon = addWeapon;

  function addPassive(id) {
    const p = Game.player;
    const def = G.PASSIVES.find((x) => x.id === id);
    if (!def) return null;
    const ex = p.passives.find((w) => w.id === id);
    if (ex) {
      if (ex.lv < (def.maxLv || 5)) { ex.lv++; return ex; }
      return null;
    }
    if (p.passives.length >= MAX_PASSIVES) return null;
    const w = { id, lv: 1, def };
    p.passives.push(w);
    return w;
  }
  Game.addPassive = addPassive;

  function getWeaponLevelEntry(w) {
    const def = w.def;
    const arr = def.levels || [];
    const i = Math.min(arr.length - 1, Math.max(0, w.lv - 1));
    return arr[i] || {};
  }
  Game.getWeaponLevelEntry = getWeaponLevelEntry;

  /* ---------- 敌人 ---------- */
  function spawnEnemy(id, x, y, opt) {
    const def = G.ENEMIES.find((e) => e.id === id);
    if (!def) return null;
    const t = Game.time;
    const o = opt || {};
    const hpScale = o.noScale ? 1 : (1 + t / 95 + Math.pow(t / 300, 1.9));
    const e = {
      id, def,
      x, y,
      vx: 0, vy: 0,
      hp: def.hp * hpScale * (o.hpMul || 1),
      maxHp: def.hp * hpScale * (o.hpMul || 1),
      speed: def.speed * (o.speedMul || 1),
      dmg: def.dmg * (o.dmgMul || 1) * (1 + t / 400),
      xp: def.xp || 1,
      r: def.r || 6,
      t: 0, flash: 0, dead: false,
      state: {},
      hpScale,
      elite: !!o.elite,
      boss: def.tier === 3,
      facing: 1,
      slow: 0, freeze: 0,
    };
    if (o.elite) {
      e.hp *= 3.2; e.maxHp = e.hp; e.r *= 1.25; e.xp *= 4; e.dmg *= 1.4;
      e.speed *= 0.86;
    }
    Game.enemies.push(e);
    if (def.onSpawn) { try { def.onSpawn(e, API); } catch (err) { } }
    return e;
  }
  Game.spawnEnemy = spawnEnemy;

  function damageEnemy(e, amount, opt) {
    if (e.dead) return 0;
    const o = opt || {};
    let dmg = amount;
    if (!o.noCrit) {
      const crit = Math.random() < (Game.player.stats.crit + Game.player.stats.luck * 0.3);
      if (crit) { dmg *= Game.player.stats.critDmg; o.crit = true; }
    }
    if (e.def && e.def.onHurt) { try { e.def.onHurt(e, dmg, API); } catch (err) { } }
    e.hp -= dmg;
    e.flash = 0.09;
    Game.stat.dmg += dmg;
    if (Game.save.settings.damageNum) {
      floatText(e.x + G.rand(-3, 3), e.y - e.r - 4, Math.round(dmg) + '', o.crit ? '#ffc84a' : '#ffffff', o.crit ? 11 : 8);
    }
    if (o.knock && !e.boss) {
      const a = o.knockAngle != null ? o.knockAngle : Math.atan2(e.y - o.fromY, e.x - o.fromX);
      const k = o.knock / (1 + (e.def.tier === 2 ? 2 : 1) * 0.6);
      e.vx += Math.cos(a) * k;
      e.vy += Math.sin(a) * k;
    }
    if (e.hp <= 0) killEnemy(e, o);
    return dmg;
  }
  Game.damageEnemy = damageEnemy;

  function killEnemy(e, opt) {
    if (e.dead) return;
    e.dead = true;
    Game.kills++;
    const p = Game.player;
    p.killCount++;
    if (e.def.onDeath) { try { e.def.onDeath(e, API); } catch (err) { } }
    // 掉经验
    const n = e.boss ? 30 : e.elite ? 6 : 1;
    for (let i = 0; i < n; i++) {
      dropPickup('gem', e.x + G.rand(-6, 6), e.y + G.rand(-6, 6), e.xp || 1);
    }
    if (e.boss) {
      for (let i = 0; i < 6; i++) dropPickup('coin', e.x + G.rand(-16, 16), e.y + G.rand(-16, 16), 12);
      dropPickup('chest', e.x, e.y, 1);
      Game.bossKilled = (Game.bossKilled || 0) + 1;
      Cam.kick(9, 0.6);
      ringFx(e.x, e.y, 140, '#ffc84a', 0.8, 3);
      if (e.id === 'boss_angler') unlockAch('a_boss1');
      if (e.id === 'boss_queen') unlockAch('a_boss2');
      if (e.id === 'boss_whale') unlockAch('a_boss3');
    } else if (e.elite) {
      dropPickup('coin', e.x, e.y, 3);
    } else if (G.chance(0.012 + Game.player.stats.luck * 0.02)) {
      dropPickup('heart', e.x, e.y, 1);
    }
    burst(e.x, e.y, e.boss ? 40 : 6, {
      color: e.boss ? ['#ff5a6e', '#ff9a3c', '#ffc84a', '#ffffff'] : ['#ff5a6e', '#8fd4f0', '#cdf1ff'],
      speed: e.boss ? 180 : 70,
      life: e.boss ? 0.9 : 0.4,
      glow: true,
    });
    if (Game.kills === 100) unlockAch('a_kill100');
    if (Game.kills === 500) unlockAch('a_kill500');
    if (Game.kills === 1500) unlockAch('a_kill1500');
  }
  Game.killEnemy = killEnemy;

  /* ---------- 掉落 ---------- */
  function dropPickup(type, x, y, value) {
    if (Game.pickups.length > 700) return;
    Game.pickups.push({
      type, x, y, vx: G.rand(-30, 30), vy: G.rand(-30, 30),
      value: value || 1, t: 0, r: type === 'chest' ? 10 : 4,
    });
  }
  Game.dropPickup = dropPickup;

  /* ---------- 特效 API ---------- */
  const API = {
    get t() { return Game.time; },
    get dt() { return Game.dt; },
    get player() { return Game.player; },
    get enemies() { return Game.enemies; },
    get projectiles() { return Game.bullets; },
    get mul() { return Game.player.stats; },
    spawnBullet(o) {
      if (Game.bullets.length > 1200) return null;
      const b = {
        x: o.x, y: o.y,
        vx: o.vx || 0, vy: o.vy || 0,
        dmg: o.dmg || 10,
        r: o.r || 3,
        life: o.life == null ? 1.2 : o.life,
        maxLife: o.life == null ? 1.2 : o.life,
        pierce: o.pierce == null ? 0 : o.pierce,
        color: o.color || '#8fd4f0',
        art: o.art || null,
        trail: o.trail !== false,
        homing: o.homing || 0,
        target: o.target || null,
        knock: o.knock || 0,
        hit: new Set(),
        rot: o.rot || 0,
        spin: o.spin || 0,
        scale: o.scale || 1,
        len: o.len || 0,
        kind: o.kind || 'orb',
        onHit: o.onHit || null,
        onDie: o.onDie || null,
        owner: o.owner || null,
        wobble: o.wobble || 0,
        t: 0,
        fromPlayer: o.fromPlayer !== false,
        accel: o.accel || 0,
        turn: o.turn || 0,
      };
      Game.bullets.push(b);
      return b;
    },
    spawnEnemy(id, x, y, opt) { return spawnEnemy(id, x, y, opt); },
    explode(x, y, radius, dmg, opt) {
      const o = opt || {};
      ringFx(x, y, radius, o.color || '#ff9a3c', 0.4, 3);
      burst(x, y, 10, { color: [o.color || '#ff9a3c', '#ffc84a', '#ffffff'], speed: radius * 2.2, life: 0.45, glow: true });
      Cam.kick(o.shake == null ? 3 : o.shake, 0.2);
      if (o.sfx !== false && G.AUDIO) G.AUDIO.sfx('explode');
      nearEnemies(x, y, radius + 12, (e) => {
        if (G.dist(x, y, e.x, e.y) <= radius + e.r) {
          damageEnemy(e, dmg, { knock: o.knock || 0, fromX: x, fromY: y });
          if (o.slow) e.slow = Math.max(e.slow, o.slow);
        }
      });
      return true;
    },
    ring(x, y, radius, color, life) { ringFx(x, y, radius, color, life); },
    slash(x, y, ang, len, width, color, life) { slashFx(x, y, ang, len, width, color, life); },
    particle(x, y, o) { particle(x, y, o); },
    burst(x, y, n, o) { burst(x, y, n, o); },
    damage(e, amount, opts) { return damageEnemy(e, amount, opts); },
    heal(n) {
      const p = Game.player;
      const before = p.hp;
      p.hp = Math.min(p.maxHp, p.hp + n);
      if (p.hp > before) {
        floatText(p.x, p.y - 12, '+' + Math.round(n), '#6ee7a0', 9);
        if (G.AUDIO) G.AUDIO.sfx('heal');
      }
    },
    shake(v) { Cam.kick(v, 0.2); },
    hitstop(s) { Game.hitstopT = Math.max(Game.hitstopT, s); },
    flash(x, y, r, color) {
      Game.effects.push({ kind: 'flash', x, y, r, color: color || '#fff', life: 0.18, max: 0.18 });
    },
    sfx(n) { if (G.AUDIO) G.AUDIO.sfx(n); },
    text(x, y, str, color) { floatText(x, y, str, color || '#fff'); },
    nearestEnemy(x, y, maxDist) {
      let best = null, bd = maxDist == null ? 1e18 : maxDist * maxDist;
      const es = Game.enemies;
      for (let i = 0; i < es.length; i++) {
        const e = es[i];
        if (e.dead) continue;
        const d = (e.x - x) * (e.x - x) + (e.y - y) * (e.y - y);
        if (d < bd) { bd = d; best = e; }
      }
      return best;
    },
    randomEnemyInRange(x, y, range) {
      const arr = API.enemiesInRange(x, y, range);
      return arr.length ? G.pick(arr) : null;
    },
    enemiesInRange(x, y, range) {
      const out = [];
      const r2 = range * range;
      nearEnemies(x, y, range, (e) => {
        if (e.dead) return;
        const dx = e.x - x, dy = e.y - y;
        if (dx * dx + dy * dy <= r2) out.push(e);
      });
      return out;
    },
    setBuff(key, value, seconds) {
      const p = Game.player;
      p.buffs[key] = Math.max(p.buffs[key] || 0, seconds);
      p.buffs[key + '_v'] = value;
    },
    rnd(a, b) { return G.rand(a, b); },
    rndi(a, b) { return G.randi(a, b); },
    pick(a) { return G.pick(a); },
    addWeapon(id) { return addWeapon(id); },
    addPassive(id) { return addPassive(id); },
    toast(s) { toast(s); },
    get weapons() { return Game.player.weapons; },
    get passives() { return Game.player.passives; },
  };
  G.api = API;

  /* ============ 开局 ============ */
  function startRun(charIdx) {
    const ch = CHARS[charIdx] || CHARS[0];
    Game.state = 'playing';
    Game.time = 0;
    Game.kills = 0;
    Game.coinsRun = 0;
    Game.enemies.length = 0;
    Game.bullets.length = 0;
    Game.pickups.length = 0;
    Game.particles.length = 0;
    Game.effects.length = 0;
    Game.texts.length = 0;
    Game.hazards.length = 0;
    Game.orbs.length = 0;
    Game.spawnTimer = 0.4;
    Game.bossIndex = 0;
    Game.bossTimer = 150;
    Game.levelUpQueue = 0;
    Game.over = false;
    Game.win = false;
    Game.hitTaken = false;
    Game.rerolls = 1;
    Game.paused = false;
    Game.stat = { dmg: 0 };
    Game.bossKilled = 0;
    Game.save.runs++;
    persist();
    const p = makePlayer(ch);
    Game.player = p;
    recomputeStats();
    addWeapon(ch.weapon);
    Cam.x = p.x; Cam.y = p.y;
    toast(ch.name + ' · 下潜开始', 2.4);
    if (G.AUDIO) { G.AUDIO.init(); G.AUDIO.music(1); }
  }
  Game.startRun = startRun;

  /* ============ 升级 ============ */
  function xpForLevel(lv) { return Math.round(6 + (lv - 1) * 5.5 + Math.pow(lv, 1.45) * 0.8); }

  function gainXp(n) {
    const p = Game.player;
    p.xp += n;
    while (p.xp >= p.xpNext) {
      p.xp -= p.xpNext;
      p.level++;
      p.xpNext = xpForLevel(p.level);
      Game.levelUpQueue++;
      if (p.level === 20) unlockAch('a_lv20');
      if (p.level === 40) unlockAch('a_lv40');
    }
    if (Game.levelUpQueue > 0 && Game.state === 'playing') openLevelUp();
  }

  function buildCards() {
    const p = Game.player;
    const pool = [];
    // 武器
    for (const w of p.weapons) {
      const def = w.def;
      // 进化
      if (def.evo && w.lv >= (def.maxLv || 8)) {
        const need = p.passives.find((x) => x.id === def.evo.need);
        const nd = G.PASSIVES.find((x) => x.id === def.evo.need);
        if (need && nd && need.lv >= (nd.maxLv || 5)) {
          const evoDef = G.WEAPONS.find((x) => x.id === def.evo.with);
          if (evoDef && !p.weapons.find((x) => x.id === evoDef.id)) {
            pool.push({ kind: 'evo', id: evoDef.id, w: w, weight: 100, rarity: 3 });
          }
        }
      }
      if (w.lv < (def.maxLv || 8) && !def.evoBase) {
        pool.push({ kind: 'wlv', id: def.id, weight: 10 + (def.rarity === 3 ? -4 : def.rarity === 2 ? -1 : 2), rarity: def.rarity || 1 });
      }
    }
    // 新武器
    if (p.weapons.length < MAX_WEAPONS) {
      for (const def of G.WEAPONS) {
        if (def.evoBase) continue;
        if (p.weapons.find((x) => x.id === def.id)) continue;
        pool.push({ kind: 'wnew', id: def.id, weight: 9 + (def.rarity === 1 ? 3 : def.rarity === 2 ? 0 : -6), rarity: def.rarity || 1 });
      }
    }
    // 被动
    for (const ps of p.passives) {
      const def = G.PASSIVES.find((x) => x.id === ps.id);
      if (def && ps.lv < (def.maxLv || 5)) pool.push({ kind: 'plv', id: def.id, weight: 10, rarity: def.rarity || 1 });
    }
    if (p.passives.length < MAX_PASSIVES) {
      for (const def of G.PASSIVES) {
        if (p.passives.find((x) => x.id === def.id)) continue;
        pool.push({ kind: 'pnew', id: def.id, weight: 9, rarity: def.rarity || 1 });
      }
    }
    // 稀有兜底
    if (!pool.length) {
      pool.push({ kind: 'heal', id: 'heal', weight: 1, rarity: 1 });
      pool.push({ kind: 'coin', id: 'coin', weight: 1, rarity: 1 });
    }
    // 加权抽
    const luck = p.stats.luck;
    const picks = [];
    const used = new Set();
    const tryPick = (bonusRare) => {
      let total = 0;
      const cand = pool.filter((c) => !used.has(c.kind + c.id));
      if (!cand.length) return null;
      for (const c of cand) {
        let w = Math.max(1, c.weight);
        if (bonusRare && c.rarity >= 2) w *= 1 + bonusRare;
        total += w;
      }
      let r = Math.random() * total;
      for (const c of cand) {
        let w = Math.max(1, c.weight);
        if (bonusRare && c.rarity >= 2) w *= 1 + bonusRare;
        r -= w;
        if (r <= 0) return c;
      }
      return cand[cand.length - 1];
    };
    for (let i = 0; i < 3; i++) {
      const c = tryPick(i === 0 ? 0 : luck);
      if (!c) break;
      used.add(c.kind + c.id);
      picks.push(c);
    }
    return picks;
  }

  function openLevelUp() {
    Game.state = 'levelup';
    Game.cards = buildCards();
    Game.cardSel = 0;
    if (G.AUDIO) G.AUDIO.sfx('levelup');
    Cam.kick(1.5, 0.15);
  }
  Game.openLevelUp = openLevelUp;

  function takeCard(c) {
    const p = Game.player;
    if (!c) return;
    if (c.kind === 'wlv') {
      const w = p.weapons.find((x) => x.id === c.id);
      if (w) { w.lv++; toast(w.def.name + ' Lv' + w.lv); }

    // 大块暗斑
    let s = 12345;
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    for (let i = 0; i < 26; i++) {
      const x = rnd() * TILE, y = rnd() * TILE, r = 8 + rnd() * 26;
      p.ellipse(x, y, r, r * 0.7, rnd() < 0.5 ? '#0c1426' : '#080d19');
    }
    // 细沙点
    for (let i = 0; i < 700; i++) {
      const x = (rnd() * TILE) | 0, y = (rnd() * TILE) | 0;
      const c = rnd();
      p.px(x, y, c < 0.5 ? '#111a2e' : c < 0.85 ? '#0d1526' : '#16223c');
    }
    // 一点点亮砂
    for (let i = 0; i < 40; i++) {
      p.px((rnd() * TILE) | 0, (rnd() * TILE) | 0, '#25324d');
    }
    floorTile = p.cv;
  };

  /* ---------- 装饰物池 ---------- */
  const DECOR = ['coral_a', 'coral_b', 'coral_c', 'rock_a', 'rock_b', 'kelp_a', 'kelp_b', 'vent', 'shell_a', 'bone_a'];
  const CELL = 150;

  function drawDecor(ctx) {
    const cx0 = Math.floor((Cam.x - G.W / 2 - 60) / CELL);
    const cx1 = Math.floor((Cam.x + G.W / 2 + 60) / CELL);
    const cy0 = Math.floor((Cam.y - G.H / 2 - 60) / CELL);
    const cy1 = Math.floor((Cam.y + G.H / 2 + 60) / CELL);
    const t = Game.time;
    for (let gy = cy0; gy <= cy1; gy++) {
      for (let gx = cx0; gx <= cx1; gx++) {
        const n = 1 + Math.floor(hash3(gx, gy, 1) * 2.4);
        for (let i = 0; i < n; i++) {
          const h1 = hash3(gx, gy, i * 5 + 2);
          const h2 = hash3(gx, gy, i * 5 + 3);
          const h3 = hash3(gx, gy, i * 5 + 4);
          if (h3 < 0.18) continue;
          const id = DECOR[(h1 * DECOR.length) | 0];
          const ax = gx * CELL + h2 * CELL;
          const ay = gy * CELL + h3 * CELL;
          const a = G.BAKED[id];
          if (!a) continue;
          const sway = id.indexOf('kelp') === 0 ? Math.sin(t * 1.1 + h1 * 9) * 1.2 : 0;
          ctx.globalAlpha = 0.85;
          G.drawArt(ctx, id, ax + sway, ay, { f: (t * 2 + h1 * 10) | 0 });
          ctx.globalAlpha = 1;
        }
      }
    }
  }

  /* ---------- 世界渲染 ---------- */
  function renderWorld(ctx) {
    const p = Game.player;
    ctx.save();
    Cam.apply(ctx);

    // ---- 地面 ----
    const ox = -((Cam.x - G.W / 2) % TILE + TILE) % TILE;
    const oy = -((Cam.y - G.H / 2) % TILE + TILE) % TILE;
    const startX = Cam.x - G.W / 2, startY = Cam.y - G.H / 2;
    const px0 = Math.floor(startX / TILE) * TILE;
    const py0 = Math.floor(startY / TILE) * TILE;
    for (let y = py0; y < startY + G.H + TILE; y += TILE) {
      for (let x = px0; x < startX + G.W + TILE; x += TILE) {
        ctx.drawImage(floorTile, x, y);
      }
    }

    // ---- 海底光斑 ----
    ctx.globalCompositeOperation = 'lighter';
    const t = Game.time;
    for (let i = 0; i < 5; i++) {
      const bx = Cam.x + Math.sin(t * 0.16 + i * 2.1) * 260;
      const by = Cam.y + Math.cos(t * 0.11 + i * 1.7) * 150;
      const r = 90 + Math.sin(t * 0.3 + i) * 30;
      const g = ctx.createRadialGradient(bx, by, 0, bx, by, r);
      g.addColorStop(0, 'rgba(80,150,220,0.055)');
      g.addColorStop(1, 'rgba(80,150,220,0)');
      ctx.fillStyle = g;
      ctx.fillRect(bx - r, by - r, r * 2, r * 2);
    }
    ctx.globalCompositeOperation = 'source-over';

    // ---- 装饰 ----
    drawDecor(ctx);

    // ---- 危险区（墨池等） ----
    for (const h of Game.hazards) {
      const k = Math.min(1, h.life / 0.4);
      ctx.globalAlpha = 0.5 * k;
      ctx.fillStyle = h.color || 'rgba(90,40,150,0.8)';
      ctx.beginPath();
      ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = h.edge || 'rgba(160,90,255,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
      ctx.stroke();
    }

    // ---- 拾取物 ----
    for (const it of Game.pickups) {
      if (!Cam.inView(it.x, it.y, 20)) continue;
      const bob = Math.sin(it.t * 6 + it.x * 0.1) * 1.2;
      const fid = (Game.frame / 8 + it.x) | 0;
      if (it.type === 'gem') {
        G.glowCircle(ctx, it.x, it.y + bob, 9, '#8fd4f0', 0.35);
        G.drawArt(ctx, 'gem', it.x, it.y + bob, { f: fid });
      } else if (it.type === 'coin') {
        G.drawArt(ctx, 'coin', it.x, it.y + bob, { f: fid });
      } else if (it.type === 'heart') {
        G.glowCircle(ctx, it.x, it.y + bob, 11, '#ff5a6e', 0.35);
        G.drawArt(ctx, 'heart', it.x, it.y + bob);
      } else if (it.type === 'chest') {
        G.glowCircle(ctx, it.x, it.y + bob, 22, '#ffc84a', 0.4);
        G.drawArt(ctx, 'chest', it.x, it.y + bob, { f: (Game.frame / 20 | 0) % 2 });
      }
    }

    // ---- 敌人 ----
    for (const e of Game.enemies) {
      if (!Cam.inView(e.x, e.y, 60)) continue;
      const a = G.BAKED[e.def.art];
      // 影子
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(e.x, e.y + (a ? a.ay * 0.72 : e.r), e.r * 1.05, e.r * 0.48, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      let scale = 1;
      if (e.boss) scale = 1;
      if (e.elite) scale = 1.22;
      const flip = e.facing < 0;
      const f = (Game.frame / 7 + (e.x | 0)) | 0;

      // 精英光环
      if (e.elite) {
        G.glowCircle(ctx, e.x, e.y - e.r * 0.4, e.r * 2.4, '#ff5a6e', 0.3);
      }
      if (e.freeze > 0) {
        G.glowCircle(ctx, e.x, e.y - e.r * 0.4, e.r * 2, '#8fd4f0', 0.4);
      }
      if (e.def.art && G.BAKED[e.def.art]) {
        ctx.save();
        if (e.flash > 0) {
          ctx.filter = 'brightness(2.4) saturate(0.3)';
        }
        G.drawArt(ctx, e.def.art, e.x, e.y, { f, flip, scale: e.elite ? 1.22 : 1 });
        ctx.restore();
      } else {
        ctx.fillStyle = '#ff5a6e';
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();
      }
      // 血条（非小怪）
      if ((e.boss || e.elite) && e.hp < e.maxHp) {
        const w = e.boss ? 0 : Math.max(14, e.r * 2.2);
        if (w > 0) {
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(e.x - w / 2, e.y - (a ? a.ay : e.r) - 7, w, 3);
          ctx.fillStyle = '#ff5a6e';
          ctx.fillRect(e.x - w / 2, e.y - (a ? a.ay : e.r) - 7, w * (e.hp / e.maxHp), 3);
        }
      }
    }

    // ---- 子弹 ----
    for (const b of Game.bullets) {
      if (!Cam.inView(b.x, b.y, 30)) continue;
      if (b.art && G.BAKED[b.art]) {
        G.drawArt(ctx, b.art, b.x, b.y, { rot: b.rot, scale: b.scale, f: (Game.frame / 6) | 0 });
      } else {
        G.glowCircle(ctx, b.x, b.y, b.r * 4.5, b.color, 0.5);
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ---- 玩家 ----
    if (p) {
      // 影子
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y + 7, 7, 3.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // 柔光
      G.glowCircle(ctx, p.x, p.y - 4, 26, '#4a90d9', 0.20);

      const flick = p.invuln > 0 && (Math.floor(p.invuln * 20) % 2 === 0);
      if (!flick) {
        const moving = Math.abs(p.vx) + Math.abs(p.vy) > 1;
        const f = moving ? (((p.animT * 9) | 0) % 4) : (((p.animT * 3) | 0) % 4);
        G.drawArt(ctx, 'whale', p.x, p.y - 2, { f, flip: p.facing < 0 });
      }

      // 冰霜/受击染色
      if (p.hurtT > 0) {
        ctx.globalAlpha = p.hurtT * 1.6;
        ctx.globalCompositeOperation = 'source-atop';
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    // ---- 粒子 ----
    for (const pt of Game.particles) {
      const k = Math.max(0, pt.life / pt.max);
      ctx.globalAlpha = pt.glow ? k * 0.9 : k;
      ctx.fillStyle = pt.color;
      const r = pt.shrink ? Math.max(0.6, pt.r * k) : pt.r;
      ctx.fillRect(pt.x - r / 2, pt.y - r / 2, r, r);
    }
    ctx.globalAlpha = 1;

    // ---- 特效 ----
    for (const fx of Game.effects) {
      const k = Math.max(0, fx.life / fx.max);
      if (fx.kind === 'ring') {
        const r = fx.r0 + (fx.r1 - fx.r0) * (1 - k);
        ctx.globalAlpha = k * 0.9;
        ctx.strokeStyle = fx.color;
        ctx.lineWidth = fx.w * k + 0.5;
        ctx.beginPath();
        ctx.arc(fx.x, fx.y, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      } else if (fx.kind === 'slash') {
        ctx.save();
        ctx.translate(fx.x, fx.y);
        ctx.rotate(fx.ang);
        ctx.globalAlpha = k * 0.95;
        ctx.fillStyle = fx.color;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, fx.len, -0.55, 0.55);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        ctx.globalAlpha = 1;
      } else if (fx.kind === 'flash') {
        ctx.globalAlpha = k * 0.7;
        G.glowCircle(ctx, fx.x, fx.y, fx.r, fx.color, 0.7);
        ctx.globalAlpha = 1;
      }
    }

    // ---- 飘字 ----
    ctx.font = '700 8px monospace';
    ctx.textAlign = 'center';
    for (const tx of Game.texts) {
      const k = Math.max(0, tx.life / tx.max);
      ctx.globalAlpha = Math.min(1, k * 1.6);
      ctx.fillStyle = '#000';
      ctx.fillText(tx.str, tx.x + 1, tx.y + 1);
      ctx.fillStyle = tx.color;
      ctx.fillText(tx.str, tx.x, tx.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';

    ctx.restore();

    // ---- 暗角 ----
    const vg = ctx.createRadialGradient(G.W / 2, G.H / 2, G.H * 0.42, G.W / 2, G.H / 2, G.H * 0.95);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, G.W, G.H);

    // ---- 受击红边 ----
    if (p && p.hurtT > 0) {
      const a = p.hurtT * 1.2;
      const g2 = ctx.createRadialGradient(G.W / 2, G.H / 2, G.H * 0.3, G.W / 2, G.H / 2, G.H * 0.9);
      g2.addColorStop(0, 'rgba(255,40,60,0)');
      g2.addColorStop(1, 'rgba(255,40,60,' + (a * 0.55) + ')');
      ctx.fillStyle = g2;
      ctx.fillRect(0, 0, G.W, G.H);
    }
  }

  /* ---------- UI 小工具 ---------- */
  function txt(ctx, str, x, y, size, color, align, bold, outline) {
    G.text(ctx, str, x, y, { size, color, align: align || 'left', bold, outline, outlineWidth: 3 });
  }
  function btn(id, x, y, w, h) {
    buttons.push({ id, x, y, w, h });
  }
  function isHover(id) { return hoverId === id; }

  function panel(ctx, x, y, w, h, r) {
    ctx.save();
    G.roundRect(ctx, x, y, w, h, r == null ? 10 : r);
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, 'rgba(20,30,52,0.94)');
    g.addColorStop(1, 'rgba(8,13,26,0.96)');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(91,147,201,0.55)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  function bar(ctx, x, y, w, h, k, c1, c2, bg) {
    ctx.fillStyle = bg || 'rgba(0,0,0,0.55)';
    G.roundRect(ctx, x, y, w, h, h / 2);
    ctx.fill();
    if (k > 0) {
      ctx.save();
      G.roundRect(ctx, x, y, Math.max(h, w * Math.min(1, k)), h, h / 2);
      ctx.clip();
      const g = ctx.createLinearGradient(x, y, x + w, y);
      g.addColorStop(0, c1);
      g.addColorStop(1, c2 || c1);
      ctx.fillStyle = g;
      ctx.fillRect(x, y, w, h);
      ctx.restore();
    }
  }

  /* ---------- HUD ---------- */
  function drawHUD(ctx, W, H) {
    const p = Game.player;
    if (!p) return;
    const s = Math.min(1.15, Math.max(0.72, W / 1280));

    // 顶部经验条
    const xpK = p.xp / p.xpNext;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, 5 * s);
    const gxp = ctx.createLinearGradient(0, 0, W, 0);
    gxp.addColorStop(0, '#2ee6c8');
    gxp.addColorStop(0.5, '#8fd4f0');
    gxp.addColorStop(1, '#b06cff');
    ctx.fillStyle = gxp;
    ctx.fillRect(0, 0, W * Math.min(1, xpK), 5 * s);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(0, 0, W * Math.min(1, xpK), 1.5 * s);

    // 左上：等级 + 血量
    const lx = 14 * s, ly = 18 * s;
    // 等级圆
    ctx.beginPath();
    ctx.arc(lx + 16 * s, ly + 16 * s, 16 * s, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(10,16,30,0.9)';
    ctx.fill();
    ctx.strokeStyle = '#5b93c9';
    ctx.lineWidth = 2 * s;
    ctx.stroke();
    txt(ctx, '' + p.level, lx + 16 * s, ly + 22 * s, 15 * s, '#cdf1ff', 'center', true);

    // 血条
    const bx = lx + 40 * s, by = ly + 4 * s, bw = 150 * s, bh = 13 * s;
    bar(ctx, bx, by, bw, bh, p.hp / p.maxHp, '#ff5a6e', '#ff9a3c');
    txt(ctx, Math.ceil(p.hp) + ' / ' + Math.round(p.maxHp), bx + bw / 2, by + bh * 0.78, 9.5 * s, '#fff', 'center', true, 'rgba(0,0,0,0.85)');

    // 金币
    const cy = by + bh + 8 * s;
    G.drawArt(ctx.canvas === G.cv ? ctx : ctx, 'coin', bx + 5 * s, cy + 2 * s, { f: (Game.frame / 10 | 0) % 2 });
    txt(ctx, '' + Game.coinsRun, bx + 15 * s, cy + 7 * s, 11 * s, '#ffe6a3', 'left', true, 'rgba(0,0,0,0.85)');

    // 右上：时间 / 击杀
    const rx = W - 16 * s;
    const mm = Math.floor(Game.time / 60), ss = Math.floor(Game.time % 60);
    txt(ctx, (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss, rx, 30 * s, 20 * s, '#cdf1ff', 'right', true, 'rgba(0,0,0,0.9)');
    txt(ctx, '击杀 ' + Game.kills, rx, 48 * s, 11 * s, 'rgba(205,241,255,0.72)', 'right', false, 'rgba(0,0,0,0.8)');

    // 底部：武器图标
    const wy = H - 26 * s;
    let wx = 14 * s;
    for (let i = 0; i < p.weapons.length; i++) {
      const w = p.weapons[i];
      ctx.fillStyle = 'rgba(8,14,26,0.82)';
      G.roundRect(ctx, wx, wy, 22 * s, 22 * s, 4 * s);
      ctx.fill();
      ctx.strokeStyle = w.def.evoBase || w.def.evo && w.lv >= (w.def.maxLv || 8) ? '#ffc84a' : 'rgba(91,147,201,0.6)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      G.drawArt(ctx, w.def.icon, wx + 11 * s, wy + 11 * s, { scale: s });
      // 等级小字
      txt(ctx, '' + w.lv, wx + 20 * s, wy + 8 * s, 8 * s, '#cdf1ff', 'right', true, 'rgba(0,0,0,0.9)');
      wx += 26 * s;
    }
    // 被动图标
    let px2 = wx + 8 * s;
    for (let i = 0; i < p.passives.length; i++) {
      const w = p.passives[i];
      ctx.fillStyle = 'rgba(8,14,26,0.75)';
      G.roundRect(ctx, px2, wy + 3 * s, 17 * s, 17 * s, 3 * s);
      ctx.fill();
      ctx.strokeStyle = 'rgba(110,231,160,0.45)';
      ctx.lineWidth = 1;
      ctx.stroke();
      G.drawArt(ctx, w.def.icon, px2 + 8.5 * s, wy + 11.5 * s, { scale: s * 0.8 });
      txt(ctx, '' + w.lv, px2 + 16 * s, wy + 8 * s, 7 * s, '#6ee7a0', 'right', true, 'rgba(0,0,0,0.9)');
      px2 += 20 * s;
    }

    // Boss 血条
    const boss = Game.enemies.find((e) => e.boss && e.hp > 0);
    if (boss) {
      const bw2 = Math.min(W * 0.5, 380 * s);
      const bx2 = (W - bw2) / 2, by2 = 16 * s;
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      G.roundRect(ctx, bx2 - 2, by2 - 2, bw2 + 4, 12 * s + 4, 6 * s);
      ctx.fill();
      bar(ctx, bx2, by2, bw2, 12 * s, boss.hp / boss.maxHp, '#b06cff', '#ff5a6e', 'rgba(20,10,30,0.9)');
      txt(ctx, boss.def.name || 'BOSS', W / 2, by2 - 5 * s, 11 * s, '#ffb0d0', 'center', true, 'rgba(0,0,0,0.9)');
    }

    // 提示消息
    if (Game.msg && Game.msgT > 0) {
      const a = Math.min(1, Game.msgT * 2);
      ctx.globalAlpha = a;
      const w = G.measureText(ctx, Game.msg, 15 * s, true);
      ctx.fillStyle = 'rgba(5,8,16,0.72)';
      G.roundRect(ctx, W / 2 - w / 2 - 14, H * 0.14 - 17 * s, w + 28, 26 * s, 13 * s);
      ctx.fill();
      txt(ctx, Game.msg, W / 2, H * 0.14 + 1, 15 * s, '#ffe6a3', 'center', true, 'rgba(0,0,0,0.9)');
      ctx.globalAlpha = 1;
    }
  }

  /* ---------- 升级选卡 ---------- */
  function drawLevelUp(ctx, W, H) {
    ctx.fillStyle = 'rgba(3,6,14,0.78)';
    ctx.fillRect(0, 0, W, H);
    const s = Math.min(1.2, Math.max(0.66, W / 1280));
    const titleY = H * 0.18;
    txt(ctx, '等 级 提 升', W / 2, titleY, 30 * s, '#ffe6a3', 'center', true, 'rgba(0,0,0,0.9)');
    txt(ctx, 'Lv ' + Game.player.level + '  ·  选一样带走', W / 2, titleY + 22 * s, 12 * s, 'rgba(205,241,255,0.7)', 'center');

    const cards = Game.cards || [];
    const n = cards.length;
    if (!n) return;
    const cw = Math.min(190 * s, (W - 80 * s) / n - 14 * s);
    const chh = 210 * s;
    const gap = 16 * s;
    const totalW = n * cw + (n - 1) * gap;
    let cx = (W - totalW) / 2;
    const cy = H * 0.34;

    for (let i = 0; i < n; i++) {
      const c = cards[i];
      const sel = i === Game.cardSel;
      const x = cx + i * (cw + gap);
      buttons.push({ id: 'card' + i, x, y: cy, w: cw, h: chh });
      const hv = isHover('card' + i);
      const lift = sel || hv ? -6 * s : 0;
      const y = cy + lift;

      // 稀有度颜色
      let rc = '#5b93c9', rc2 = 'rgba(91,147,201,0.15)';
      if (c.rarity === 3) { rc = '#ffc84a'; rc2 = 'rgba(255,200,74,0.18)'; }
      else if (c.rarity === 2) { rc = '#b06cff'; rc2 = 'rgba(176,108,255,0.16)'; }

      ctx.save();
      ctx.shadowColor = rc;
      ctx.shadowBlur = (sel || hv) ? 22 * s : 8 * s;
      G.roundRect(ctx, x, y, cw, chh, 12 * s);
      const g = ctx.createLinearGradient(0, y, 0, y + chh);
      g.addColorStop(0, 'rgba(26,38,64,0.98)');
      g.addColorStop(1, 'rgba(9,14,28,0.98)');
      ctx.fillStyle = g;
      ctx.fill();
      ctx.restore();

      ctx.strokeStyle = rc;
      ctx.lineWidth = (sel || hv) ? 2.4 * s : 1.4 * s;
      G.roundRect(ctx, x, y, cw, chh, 12 * s);
      ctx.stroke();

      // 顶部色带
      ctx.save();
      G.roundRect(ctx, x, y, cw, chh, 12 * s);
      ctx.clip();
      ctx.fillStyle = rc2;

      } else if (c.kind === 'wnew') {
        const def = G.WEAPONS.find((q) => q.id === c.id);

        lvTxt = '新武器';
      } else if (c.kind === 'plv') {
        const w = Game.player.passives.find((q) => q.id === c.id);
        const def = w ? w.def : G.PASSIVES.find((q) => q.id === c.id);
        iconId = def.icon; name = def.name; desc = def.desc;
        lvTxt = 'Lv' + w.lv + ' → Lv' + (w.lv + 1);
      } else if (c.kind === 'pnew') {
        const def = G.PASSIVES.find((q) => q.id === c.id);
        iconId = def.icon; name = def.name; desc = def.desc;
        lvTxt = '新被动';

      if (iconId) {

      txt(ctx, '' + (i + 1), x + cw / 2, y + chh - 12 * s, 11 * s, 'rgba(205,241,255,0.32)', 'center', true);

  function wrapText(ctx, str, cx, y, maxW, lineH, size, color, align) {
    ctx.save();
    ctx.font = size + 'px "Microsoft YaHei","PingFang SC",sans-serif';
    const lines = [];
    let cur = '';
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      if (ctx.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; }
      else cur += ch;
    }
    if (cur) lines.push(cur);
    ctx.restore();
    for (let i = 0; i < lines.length && i < 5; i++) {
      txt(ctx, lines[i], cx, y + i * lineH, size, color, align || 'center');
    }
  }

  /* ---------- 背景（菜单用） ---------- */
  const bubbles = [];
  for (let i = 0; i < 60; i++) {
    bubbles.push({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 3.5, sp: 0.01 + Math.random() * 0.05, ph: Math.random() * 9 });
  }
  function drawMenuBG(ctx, W, H, t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a1428');
    g.addColorStop(0.4, '#081020');
    g.addColorStop(1, '#03050b');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 光柱
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 4; i++) {
      const x = W * (0.16 + i * 0.23) + Math.sin(t * 0.2 + i) * 40;
      const w = 60 + Math.sin(t * 0.35 + i * 2) * 24;
      const lg = ctx.createLinearGradient(x, 0, x, H);
      lg.addColorStop(0, 'rgba(90,160,230,0.10)');
      lg.addColorStop(0.6, 'rgba(90,160,230,0.03)');
      lg.addColorStop(1, 'rgba(90,160,230,0)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(x - w * 0.25, 0);
      ctx.lineTo(x + w * 0.25, 0);
      ctx.lineTo(x + w, H);
      ctx.lineTo(x - w, H);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // 气泡
    ctx.save();
    for (const b of bubbles) {
      b.y -= b.sp * 0.006;
      if (b.y < -0.05) { b.y = 1.05; b.x = Math.random(); }
      const x = (b.x + Math.sin(t * 0.6 + b.ph) * 0.006) * W;
      const y = b.y * H;
      ctx.beginPath();
      ctx.arc(x, y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(160,220,255,0.10)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(160,220,255,0.16)';
      ctx.lineWidth = 0.7;
      ctx.stroke();
    }
    ctx.restore();

    // 海底剪影
    ctx.fillStyle = '#050810';
    ctx.beginPath();
    ctx.moveTo(0, H);
    let yy = H * 0.86;
    for (let x = 0; x <= W; x += 20) {
      yy = H * 0.86 + Math.sin(x * 0.008 + 1.2) * 12 + Math.sin(x * 0.021) * 6;
      ctx.lineTo(x, yy);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }

  function drawMeta(ctx, W, H, t) {
    drawMenuBG(ctx, W, H, t);

    txt(ctx, '深 海 强 化', W / 2, H * 0.11, 26 * s, '#dff4ff', 'center', true, 'rgba(0,0,0,0.8)');
    txt(ctx, '金币 ' + Game.save.coins, W / 2, H * 0.11 + 24 * s, 14 * s, '#ffe6a3', 'center', true);

    const rows = defs.length;
    const pw = Math.min(560 * s, W - 60 * s);
    const rh = 46 * s;
    const px = (W - pw) / 2;
    const py = H * 0.24;
    for (let i = 0; i < rows; i++) {
      const d = defs[i];
      const lv = Game.save.meta[d.id] || 0;
      const max = d.max;
      const cost = Math.round(d.cost * (1 + lv * 0.75));
      const full = lv >= max;
      const can = !full && Game.save.coins >= cost;
      const y = py + i * (rh + 8 * s);
      buttons.push({ id: 'meta' + i, x: px, y, w: pw, h: rh });
      const hv = isHover('meta' + i);

      ctx.fillStyle = hv && can ? 'rgba(28,44,74,0.95)' : 'rgba(10,17,31,0.9)';

      ctx.strokeStyle = full ? 'rgba(255,200,74,0.5)' : can ? 'rgba(91,147,201,0.55)' : 'rgba(60,72,96,0.45)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      txt(ctx, d.name, px + 14 * s, y + 19 * s, 14 * s, '#fff', 'left', true);
      txt(ctx, d.desc, px + 14 * s, y + 35 * s, 10.5 * s, 'rgba(205,241,255,0.6)');

      // 等级点
      const dotY = y + rh / 2;
      const dotX = px + pw - 190 * s;
      for (let k = 0; k < max; k++) {
        ctx.beginPath();
        ctx.arc(dotX + k * 12 * s, dotY, 3.6 * s, 0, Math.PI * 2);

      ctx.stroke();
      txt(ctx, full ? '满级' : (cost + ' 金'), bx2 + bw2 / 2, by2 + bh2 * 0.66, 11 * s, full ? '#ffc84a' : can ? '#2ee6c8' : 'rgba(160,172,190,0.6)', 'center', true);

    const by = H - 50 * s;
    buttons.push({ id: 'meta_back', x: W / 2 - 70 * s, y: by, w: 140 * s, h: 34 * s });

    ctx.lineWidth = 1.3;
    ctx.stroke();
    txt(ctx, '返 回', W / 2, by + 22 * s, 14 * s, '#7b8aa3', 'center', true);

    const pw = Math.min(480 * s, W - 70 * s);
    const rh = 44 * s;
    const px = (W - pw) / 2;
    let py = H * 0.24;
    for (const row of SET_ROWS) {
      const y = py;
      G.roundRect(ctx, px, y, pw, rh, 8 * s);
      ctx.fillStyle = 'rgba(10,17,31,0.88)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(91,147,201,0.35)';
      ctx.lineWidth = 1.1;
      ctx.stroke();
      txt(ctx, row.name, px + 14 * s, y + rh * 0.63, 13.5 * s, '#fff', 'left', true);

      if (row.toggle) {
        const on = Game.save.settings[row.id] !== false;
        const tw = 46 * s, th = 22 * s;
        const tx = px + pw - tw - 14 * s, ty = y + (rh - th) / 2;
        buttons.push({ id: 'set_' + row.id, x: tx - 10 * s, y, w: tw + 20 * s, h: rh });
        G.roundRect(ctx, tx, ty, tw, th, th / 2);
        ctx.fillStyle = on ? 'rgba(46,230,200,0.55)' : 'rgba(80,92,110,0.5)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(on ? tx + tw - th / 2 : tx + th / 2, ty + th / 2, th / 2 - 2 * s, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        txt(ctx, on ? '开' : '关', tx + tw / 2, ty + th * 0.68, 10 * s, '#fff', 'center', true);
      } else {
        const v = Game.save.settings[row.id] == null ? 0.7 : Game.save.settings[row.id];
        const bw = pw * 0.42;
        const bx = px + pw - bw - 20 * s;
        const by = y + rh / 2;
        buttons.push({ id: 'set_' + row.id, x: bx - 4, y, w: bw + 8, h: rh });
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        G.roundRect(ctx, bx, by - 4 * s, bw, 8 * s, 4 * s);
        ctx.fill();
        ctx.fillStyle = '#2ee6c8';
        G.roundRect(ctx, bx, by - 4 * s, bw * v, 8 * s, 4 * s);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(bx + bw * v, by, 7 * s, 0, Math.PI * 2);
        ctx.fillStyle = '#cdf1ff';
        ctx.fill();
        txt(ctx, Math.round(v * 100) + '%', bx + bw + 6 * s, by + 5 * s, 10 * s, 'rgba(205,241,255,0.6)');
      }
      py += rh + 8 * s;
    }

    // 擦除存档
    const dy = py + 12 * s;
    buttons.push({ id: 'set_wipe', x: W / 2 - 80 * s, y: dy, w: 160 * s, h: 30 * s });
    const hv = isHover('set_wipe');
    G.roundRect(ctx, W / 2 - 80 * s, dy, 160 * s, 30 * s, 15 * s);
    ctx.fillStyle = hv ? 'rgba(255,90,110,0.28)' : 'rgba(255,90,110,0.12)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,90,110,0.7)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    txt(ctx, '清除全部存档', W / 2, dy + 20 * s, 12 * s, '#ff5a6e', 'center', true);

    const by = H - 48 * s;
    buttons.push({ id: 'set_back', x: W / 2 - 70 * s, y: by, w: 140 * s, h: 34 * s });
    const hv2 = isHover('set_back');
    G.roundRect(ctx, W / 2 - 70 * s, by, 140 * s, 34 * s, 17 * s);
    ctx.fillStyle = hv2 ? 'rgba(123,138,163,0.3)' : 'rgba(123,138,163,0.14)';
    ctx.fill();
    ctx.strokeStyle = '#7b8aa3';
    ctx.lineWidth = 1.3;
    ctx.stroke();
    txt(ctx, '返 回', W / 2, by + 22 * s, 14 * s, '#7b8aa3', 'center', true);
  }

  /* ---------- 暂停 ---------- */
  function drawPause(ctx, W, H) {
    ctx.fillStyle = 'rgba(3,6,14,0.72)';
    ctx.fillRect(0, 0, W, H);
    const s = Math.min(1.2, Math.max(0.66, W / 1280));
    txt(ctx, '暂 停', W / 2, H * 0.32, 32 * s, '#dff4ff', 'center', true, 'rgba(0,0,0,0.9)');

    // 面板：当前装备
    const pw = Math.min(420 * s, W - 60 * s);
    const px = (W - pw) / 2;
    const py = H * 0.40;
    panel(ctx, px, py, pw, 120 * s, 10 * s);
    txt(ctx, '武器', px + 14 * s, py + 20 * s, 12 * s, 'rgba(205,241,255,0.6)');
    const p = Game.player;
    let ix = px + 14 * s, iy = py + 30 * s;
    for (const w of p.weapons) {
      G.drawArt(ctx, w.def.icon, ix + 11 * s, iy + 11 * s, { scale: s });
      txt(ctx, w.def.name + ' Lv' + w.lv, ix + 24 * s, iy + 15 * s, 10 * s, '#cdf1ff');
      ix += 130 * s;
      if (ix > px + pw - 120 * s) { ix = px + 14 * s; iy += 20 * s; }
    }
    txt(ctx, '被动', px + 14 * s, iy + 40 * s, 12 * s, 'rgba(205,241,255,0.6)');
    ix = px + 14 * s; iy = iy + 50 * s;
    for (const w of p.passives) {
      G.drawArt(ctx, w.def.icon, ix + 9 * s, iy + 9 * s, { scale: s * 0.85 });
      txt(ctx, w.def.name + ' Lv' + w.lv, ix + 20 * s, iy + 13 * s, 9.5 * s, '#6ee7a0');
      ix += 130 * s;
      if (ix > px + pw - 120 * s) { ix = px + 14 * s; iy += 18 * s; }
    }

    const by = H * 0.75;
    const items = [
      { id: 'p_resume', label: '继续' },
      { id: 'p_quit', label: '放弃并返回' },
    ];
    const bw = 150 * s, bh = 36 * s;
    let bx = W / 2 - bw - 8 * s;
    for (const it of items) {
      buttons.push({ id: it.id, x: bx, y: by, w: bw, h: bh });
      const hv = isHover(it.id);
      G.roundRect(ctx, bx, by, bw, bh, bh / 2);
      ctx.fillStyle = hv ? 'rgba(46,230,200,0.28)' : 'rgba(46,230,200,0.12)';
      ctx.fill();
      ctx.strokeStyle = it.id === 'p_quit' ? 'rgba(255,90,110,0.8)' : '#2ee6c8';
      ctx.lineWidth = 1.3;
      ctx.stroke();
      txt(ctx, it.label, bx + bw / 2, by + bh * 0.64, 13 * s, it.id === 'p_quit' ? '#ff5a6e' : '#2ee6c8', 'center', true);
      bx += bw + 16 * s;
    }
  }

  /* ---------- 结算 ---------- */
  function drawResult(ctx, W, H, t) {
    ctx.fillStyle = 'rgba(3,6,14,0.82)';
    ctx.fillRect(0, 0, W, H);
    const s = Math.min(1.25, Math.max(0.68, W / 1280));
    const won = Game.state === 'win';

    ctx.save();
    ctx.shadowColor = won ? 'rgba(255,200,74,0.8)' : 'rgba(255,90,110,0.7)';
    ctx.shadowBlur = 24 * s;
    txt(ctx, won ? '深 渊 征 服' : '下 潜 结 束', W / 2, H * 0.18, 36 * s, won ? '#ffe6a3' : '#ff8f9e', 'center', true);
    ctx.restore();

    const p = Game.player;
    const mm = Math.floor(Game.time / 60), ss = Math.floor(Game.time % 60);
    const stats = [
      ['存活时间', mm + ':' + (ss < 10 ? '0' : '') + ss],
      ['击杀数', '' + Game.kills],
      ['等级', 'Lv' + p.level],
      ['获得金币', '' + Game.coinsRun],
    ];
    const pw = Math.min(420 * s, W - 60 * s);
    const px = (W - pw) / 2;
    const py = H * 0.28;
    panel(ctx, px, py, pw, 150 * s, 12 * s);
    for (let i = 0; i < stats.length; i++) {
      const y = py + 30 * s + i * 30 * s;
      txt(ctx, stats[i][0], px + 22 * s, y, 13 * s, 'rgba(205,241,255,0.62)');
      txt(ctx, stats[i][1], px + pw - 22 * s, y, 17 * s, '#fff', 'right', true);
    }

    const by = H * 0.72;
    const bw = 150 * s, bh = 38 * s;
    buttons.push({ id: 'r_again', x: W / 2 - bw - 8 * s, y: by, w: bw, h: bh });
    let hv = isHover('r_again');
    G.roundRect(ctx, W / 2 - bw - 8 * s, by, bw, bh, bh / 2);
    ctx.fillStyle = hv ? 'rgba(46,230,200,0.3)' : 'rgba(46,230,200,0.15)';
    ctx.fill();
    ctx.strokeStyle = '#2ee6c8';
    ctx.lineWidth = hv ? 2 : 1.3;
    ctx.stroke();
    txt(ctx, '再 来 一 局', W / 2 - bw / 2 - 8 * s, by + bh * 0.64, 14 * s, '#2ee6c8', 'center', true);

    buttons.push({ id: 'r_menu', x: W / 2 + 8 * s, y: by, w: bw, h: bh });
    hv = isHover('r_menu');
    G.roundRect(ctx, W / 2 + 8 * s, by, bw, bh, bh / 2);
    ctx.fillStyle = hv ? 'rgba(123,138,163,0.3)' : 'rgba(123,138,163,0.14)';
    ctx.fill();
    ctx.strokeStyle = '#7b8aa3';
    ctx.lineWidth = hv ? 2 : 1.3;
    ctx.stroke();
    txt(ctx, '返 回 主 页', W / 2 + bw / 2 + 8 * s, by + bh * 0.64, 14 * s, '#7b8aa3', 'center', true);
  }

  /* ---------- 音频设置同步 ---------- */
  function applyVolumes() {
    if (!G.AUDIO) return;
    try {
      if (G.AUDIO.setVolume) G.AUDIO.setVolume(Game.save.settings.master);
      if (G.AUDIO.setMusicVolume) G.AUDIO.setMusicVolume(Game.save.settings.music);
      if (G.AUDIO.setSfxVolume) G.AUDIO.setSfxVolume(Game.save.settings.sfx);
    } catch (e) { }
  }
  UI.applyVolumes = applyVolumes;

  /* ---------- 每帧 ---------- */
  let uiT = 0;
  UI.frame = function (dt) {
    uiT += dt;
    const ctx = G.ctx, uctx = G.uctx;
    const W = G.uiW || window.innerWidth, H = G.uiH || window.innerHeight;

    // 清理按钮表（保留上一帧结果用于点击判定）
    const prev = UI.prevButtons || [];
    hoverId = null;
    for (const b of prev) {
      if (G.mouse.sx >= b.x && G.mouse.sx <= b.x + b.w && G.mouse.sy >= b.y && G.mouse.sy <= b.y + b.h) {
        hoverId = b.id;
        break;
      }
    }
    buttons.length = 0;

    // --- 游戏世界 ---
    if (Game.state === 'playing' || Game.state === 'paused' || Game.state === 'levelup' ||
      Game.state === 'dead' || Game.state === 'win') {
      ctx.save();
      ctx.fillStyle = '#05070d';
      ctx.fillRect(0, 0, G.W, G.H);
      renderWorld(ctx);
      ctx.restore();
    } else {
      ctx.fillStyle = '#05070d';
      ctx.fillRect(0, 0, G.W, G.H);
    }

    // --- UI 层 ---
    uctx.clearRect(0, 0, W, H);

    if (Game.state === 'playing') {
      drawHUD(uctx, W, H);
    } else if (Game.state === 'paused') {
      drawHUD(uctx, W, H);
      drawPause(uctx, W, H);
    } else if (Game.state === 'levelup') {
      drawHUD(uctx, W, H);
      drawLevelUp(uctx, W, H);
    } else if (Game.state === 'dead' || Game.state === 'win') {
      drawResult(uctx, W, H);
    } else if (Game.state === 'title') {
      drawTitle(uctx, W, H, uiT);
    } else if (Game.state === 'chars') {
      drawChars(uctx, W, H, uiT);
    } else if (Game.state === 'meta') {
      drawMeta(uctx, W, H, uiT);
    } else if (Game.state === 'ach') {
      drawAch(uctx, W, H, uiT);
    } else if (Game.state === 'settings') {
      drawSettings(uctx, W, H, uiT);
    }

    UI.prevButtons = buttons.slice();

    // --- 点击处理 ---
    if (G.mouse.clicked) {
      const mx = G.mouse.sx, my = G.mouse.sy;
      for (const b of UI.prevButtons) {
        if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
          handleClick(b.id);
          break;
        }
      }
    }

    // --- 键盘 ---
    handleKeys();
  };

  function handleKeys() {
    const st = Game.state;
    if (G.pressed.esc) {
      if (st === 'playing') { Game.state = 'paused'; if (G.AUDIO) G.AUDIO.sfx('ui'); }
      else if (st === 'paused') { Game.state = 'playing'; if (G.AUDIO) G.AUDIO.sfx('ui'); }
      else if (st === 'levelup') { /* 不许跳过 */ }
      else if (st === 'chars' || st === 'meta' || st === 'ach' || st === 'settings') { Game.state = 'title'; if (G.AUDIO) G.AUDIO.sfx('ui'); }
    }
    if (st === 'levelup') {
      if (G.pressed.left) { Game.cardSel = (Game.cardSel + Game.cards.length - 1) % Game.cards.length; if (G.AUDIO) G.AUDIO.sfx('ui'); }
      if (G.pressed.right) { Game.cardSel = (Game.cardSel + 1) % Game.cards.length; if (G.AUDIO) G.AUDIO.sfx('ui'); }
      if (G.pressed['1']) { Game.cardSel = 0; }
      if (G.pressed['2']) { Game.cardSel = 1; }
      if (G.pressed['3']) { Game.cardSel = 2; }
      if (G.pressed.ok || G.pressed['1'] || G.pressed['2'] || G.pressed['3']) {
        const c = Game.cards[Game.cardSel];
        if (c && !(G.pressed.ok && Game.cardSel < 0)) Game.takeCard(c);
        if (G.AUDIO) G.AUDIO.sfx('ui');
      }
      if (G.pressed.r && Game.rerolls > 0) doReroll();
    }
    if (st === 'paused' && G.pressed.q) { quitToTitle(); }
    if (st === 'dead' || st === 'win') {
      if (G.pressed.ok || G.pressed.r) { Game.state = 'chars'; Game.selIndex = 0; }
    }
    if (st === 'chars') {
      if (G.pressed.left) { Game.selIndex = (Game.selIndex + Game.CHARS.length - 1) % Game.CHARS.length; if (G.AUDIO) G.AUDIO.sfx('ui'); }
      if (G.pressed.right) { Game.selIndex = (Game.selIndex + 1) % Game.CHARS.length; if (G.AUDIO) G.AUDIO.sfx('ui'); }
      if (G.pressed.ok) tryStart();
    }
    if (st === 'title' && G.pressed.ok) { Game.state = 'chars'; }
  }

  function doReroll() {
    Game.rerolls--;
    Game.cards = rebuildCardsPublic();
    Game.cardSel = 0;
    if (G.AUDIO) G.AUDIO.sfx('ui');
  }
  function rebuildCardsPublic() {
    // 复用游戏层的抽卡：先伪造成 levelup 再抽
    const p = Game.player;
    const saved = Game.state;
    Game.state = 'playing';
    const res = (function () {
      // 直接调用内部逻辑：通过临时提高等级触发不可行，这里简单再抽一次
      return Game.retryCards ? Game.retryCards() : Game.cards;
    })();
    Game.state = saved;
    return res;
  }

  function tryStart() {
    const c = Game.CHARS[Game.selIndex];
    if (c.cost > 0 && !Game.save.unlocked[c.id]) {
      if (Game.save.coins >= c.cost) {
        Game.save.coins -= c.cost;
        Game.save.unlocked[c.id] = true;
        Game.persist();
        Game.toast('解锁 ' + c.name + '！');
        if (G.AUDIO) G.AUDIO.sfx('chest');
      } else {
        Game.toast('金币不够哦');
        if (G.AUDIO) G.AUDIO.sfx('ui_bad');
      }
      return;
    }
    Game.startRun(Game.selIndex);
    UI.applyVolumes();
  }

  function quitToTitle() {
    Game.state = 'title';
    Game.paused = false;
    if (G.AUDIO) G.AUDIO.music(0);
  }

  function handleClick(id) {
    if (G.AUDIO) { try { G.AUDIO.init(); } catch (e) { } }
    switch (id) {
      case 'b_start': Game.state = 'chars'; G.AUDIO && G.AUDIO.sfx('ui'); break;
      case 'b_meta': Game.state = 'meta'; G.AUDIO && G.AUDIO.sfx('ui'); break;
      case 'b_ach': Game.state = 'ach'; G.AUDIO && G.AUDIO.sfx('ui'); break;
      case 'b_set': Game.state = 'settings'; G.AUDIO && G.AUDIO.sfx('ui'); break;
      case 'char_go': tryStart(); break;
      case 'char_back': Game.state = 'title'; break;
      case 'meta_back': Game.state = 'title'; break;
      case 'ach_back': Game.state = 'title'; break;
      case 'set_back': Game.state = 'title'; Game.persist(); break;
      case 'set_wipe':
        if (Game.save._wipeConfirm) {
          G.clearSave();
          Game.loadGame();
          Game.save = Game.defaultSave();
          Game.persist();
          Game.toast('存档已清除');
          delete Game.save._wipeConfirm;
        } else {
          Game.save._wipeConfirm = true;
          Game.toast('再点一次确认清除');
          setTimeout(() => { delete Game.save._wipeConfirm; }, 3000);
        }
        break;
      case 'p_resume': Game.state = 'playing'; break;
      case 'p_quit': quitToTitle(); break;
      case 'r_again': Game.state = 'chars'; Game.selIndex = 0; break;
      case 'r_menu': quitToTitle(); break;
      case 'reroll': if (Game.rerolls > 0) doReroll(); break;
    }
    if (id.startsWith('char') && id !== 'char_go' && id !== 'char_back') {
      const i = parseInt(id.slice(4), 10);
      if (!isNaN(i)) { Game.selIndex = i; if (G.AUDIO) G.AUDIO.sfx('ui'); }
    }
    if (id.startsWith('card')) {
      const i = parseInt(id.slice(4), 10);
      if (!isNaN(i) && Game.cards[i]) { Game.cardSel = i; Game.takeCard(Game.cards[i]); if (G.AUDIO) G.AUDIO.sfx('ui'); }
    }
    if (id.startsWith('meta')) {
      const i = parseInt(id.slice(4), 10);
      const d = G.META_DEF[i];
      if (d) {
        const lv = Game.save.meta[d.id] || 0;
        const cost = Math.round(d.cost * (1 + lv * 0.75));
        if (lv < d.max && Game.save.coins >= cost) {
          Game.save.coins -= cost;
          Game.save.meta[d.id] = lv + 1;
          Game.persist();
          if (G.AUDIO) G.AUDIO.sfx('chest');
        } else if (lv >= d.max) {
          if (G.AUDIO) G.AUDIO.sfx('ui_bad');
        } else {
          Game.toast('金币不够');
          if (G.AUDIO) G.AUDIO.sfx('ui_bad');
        }
      }
    }
    if (id.startsWith('set_') && id !== 'set_back' && id !== 'set_wipe') {
      const key = id.slice(4);
      const row = SET_ROWS.find((r) => r.id === key);
      if (row && row.toggle) {
        Game.save.settings[key] = Game.save.settings[key] === false;
        Game.persist();
        if (G.AUDIO) G.AUDIO.sfx('ui');
      } else {
        // 点击音量条：按位置设值
        const b = (UI.prevButtons || []).find((q) => q.id === id);
        if (b) {
          const k = G.clamp((G.mouse.sx - b.x) / b.w, 0, 1);
          Game.save.settings[key] = k;
          Game.persist();
          applyVolumes();
        }
      }
    }
  }

  /* 拖动音量条 */
  UI.dragVolume = function () { };
  window.addEventListener('mousemove', (ev) => {
    if (!G.mouse.down) return;
    const hid = hoverId;
    if (hid && hid.startsWith('set_') && hid !== 'set_back' && hid !== 'set_wipe') {
      const key = hid.slice(4);
      const row = SET_ROWS.find((r) => r.id === key);
      if (row && !row.toggle) {
        const b = (UI.prevButtons || []).find((q) => q.id === hid);
        if (b) {
          Game.save.settings[key] = G.clamp((ev.clientX - b.x) / b.w, 0, 1);
          applyVolumes();
        }
      }
    }
  });

  UI.init = function () { applyVolumes(); };
})();

})();
</script>
<script>
(function(){
  setTimeout(function(){
    var b = document.getElementById('boot');
    if(b) b.style.display = 'none';
    try { if (window.G && G.UI && G.UI.init) G.UI.init(); } catch(e){ console.warn(e); }
  }, 260);
})();
</script>
